<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Affinity Admin | All Projects</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f4f7fb;color:#1d3553}
.app{display:flex;min-height:100vh}
.sidebar{
 width:280px;background:#18324d;color:#fff;padding:30px 20px;
 position:fixed;height:100vh
}
.logo{font-size:28px;font-weight:900;margin:10px 15px 45px}
.logo span{color:#78a9f5}
.nav a{
 display:block;padding:17px 20px;margin:8px 0;border-radius:12px;
 color:#c8d5e5;text-decoration:none;font-weight:bold
}
.nav a:hover,.nav a.active{background:#2865b7;color:#fff}
.main{margin-left:280px;width:calc(100% - 280px);padding:35px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}
.top h1{font-size:34px}.top p{color:#6c7c8f;margin-top:8px}
.btn{
 border:0;background:#2464b7;color:#fff;padding:14px 22px;border-radius:12px;
 font-weight:bold;text-decoration:none;cursor:pointer
}
.filters{
 display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:15px;margin-bottom:25px
}
input,select{
 padding:15px;border:1px solid #d9e2ec;border-radius:12px;font:inherit;background:#fff
}
.clear{background:#fff;color:#1d3553;border:1px solid #d9e2ec}
.count{color:#66788a;margin-bottom:20px}
.projects{
 display:grid;grid-template-columns:repeat(3,1fr);gap:20px
}
.card{
 background:#fff;border:1px solid #e1e8f0;border-radius:18px;overflow:hidden;
 box-shadow:0 8px 25px rgba(20,50,80,.05)
}
.image{
 height:190px;background:#e8eef5;width:100%;object-fit:cover
}
.no-image{
 height:190px;display:flex;align-items:center;justify-content:center;
 background:#e8eef5;color:#7c8c9e;font-size:45px
}
.body{padding:20px}
.title-row{display:flex;justify-content:space-between;gap:10px;align-items:start}
h3{font-size:20px}
.badge{padding:7px 10px;border-radius:20px;font-size:10px;font-weight:bold;white-space:nowrap}
.ongoing{background:#e8f2ff;color:#2464b7}
.upcoming{background:#f1eaff;color:#7654b8}
.completed{background:#e4f7ed;color:#18865b}
.active{background:#e8f2ff;color:#2464b7}
.inactive{background:#eef0f3;color:#607080}
.info{color:#697b8d;margin-top:12px;font-size:14px}
.offer{margin-top:15px;background:#fff5df;color:#a46400;padding:10px;border-radius:9px;font-size:13px}
.actions{display:flex;gap:10px;margin-top:20px}
.edit,.delete{
 flex:1;text-align:center;padding:11px;border-radius:9px;text-decoration:none;
 font-weight:bold;border:0;cursor:pointer
}
.edit{background:#eaf2ff;color:#2464b7}
.delete{background:#fff0f0;color:#c64040}
.empty{
 grid-column:1/-1;background:#fff;border:1px dashed #ccd7e3;border-radius:20px;
 padding:80px 20px;text-align:center;color:#68798b
}
@media(max-width:1100px){.projects{grid-template-columns:repeat(2,1fr)}}
@media(max-width:800px){
 .sidebar{position:static;width:100%;height:auto}.app{display:block}
 .main{margin:0;width:100%;padding:20px}.filters{grid-template-columns:1fr}
 .projects{grid-template-columns:1fr}.top{flex-direction:column;align-items:flex-start;gap:15px}
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar">
 <div class="logo">AFFINITY <span>ADMIN</span></div>
 <nav class="nav">
  <a href="admin.html">🏠 Dashboard</a>
  <a href="add-project.html">➕ Add Project</a>
  <a class="active" href="all-projects.html">🏢 All Projects</a>
  <a href="leads.html">👥 Leads</a>
 </nav>
</aside>

<main class="main">

<div class="top">
 <div>
  <h1>All Projects</h1>
  <p>Manage, edit and delete your Affinity Realty projects.</p>
 </div>
 <a class="btn" href="add-project.html">+ Add New Project</a>
</div>

<div class="filters">
 <input id="search" placeholder="Search project name, location or type...">
 <select id="statusFilter">
  <option value="">All Status</option>
  <option>Ongoing</option>
  <option>Upcoming</option>
  <option>Completed</option>
  <option>Active</option>
  <option>Inactive</option>
 </select>
 <select id="typeFilter">
  <option value="">All Property Types</option>
  <option>Residential Project</option>
  <option>Commercial Project</option>
  <option>Plotted Development</option>
  <option>Villa Project</option>
  <option>Apartment</option>
  <option>Mixed Use Project</option>
 </select>
 <button class="btn clear" onclick="clearFilters()">Clear</button>
</div>

<div class="count" id="count">Showing 0 project(s)</div>
<div class="projects" id="projectsBox"></div>

</main>
</div>

<script>
function getProjects(){
 return JSON.parse(localStorage.getItem("affinityProjects") || "[]");
}
function saveProjects(projects){
 localStorage.setItem("affinityProjects",JSON.stringify(projects));
}
function escapeHtml(text=""){
 const div=document.createElement("div");
 div.textContent=text;
 return div.innerHTML;
}
function renderProjects(){
 const search=document.getElementById("search").value.toLowerCase().trim();
 const status=document.getElementById("statusFilter").value;
 const type=document.getElementById("typeFilter").value;

 let projects=getProjects();

 projects=projects.filter(p=>{
   const searchable=[
     p.name,p.location,p.propertyType,p.description
   ].join(" ").toLowerCase();

   return (!search || searchable.includes(search))
     &&(!status || p.status===status)
     &&(!type || p.propertyType===type);
 });

 document.getElementById("count").textContent=`Showing ${projects.length} project(s)`;

 const box=document.getElementById("projectsBox");

 if(!projects.length){
   box.innerHTML=`
   <div class="empty">
    <h2>No Projects Found</h2>
    <p style="margin:12px 0 25px">No project is currently available.</p>
    <a class="btn" href="add-project.html">+ Add Project</a>
   </div>`;
   return;
 }

 box.innerHTML=projects
 .sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0))
 .map(p=>`
 <div class="card">

  ${p.image
   ?`<img class="image" src="${p.image}" alt="${escapeHtml(p.name)}">`
   :`<div class="no-image">🏢</div>`}

  <div class="body">
   <div class="title-row">
    <h3>${escapeHtml(p.name)}</h3>
    <span class="badge ${String(p.status).toLowerCase()}">${escapeHtml(p.status)}</span>
   </div>

   <div class="info">📍 ${escapeHtml(p.location || "No location")}</div>
   <div class="info">🏠 ${escapeHtml(p.propertyType || "-")}</div>

   ${p.price ? `<div class="info">💰 ${escapeHtml(p.price)}</div>` : ""}

   ${p.offer && p.offer.enabled && p.offer.title
     ?`<div class="offer">🎉 ${escapeHtml(p.offer.title)}
        ${p.offer.discount ? "- "+escapeHtml(p.offer.discount):""}
       </div>`:""}

   <div class="actions">
    <a class="edit" href="add-project.html?edit=${encodeURIComponent(p.id)}">✏️ Edit</a>
    <button class="delete" onclick="deleteProject('${p.id}')">🗑 Delete</button>
   </div>
  </div>
 </div>
 `).join("");
}

function deleteProject(id){
 const project=getProjects().find(p=>p.id===id);
 if(!project)return;

 if(confirm(`Delete "${project.name}"?\n\nThis action cannot be undone.`)){
   saveProjects(getProjects().filter(p=>p.id!==id));
   renderProjects();
 }
}

function clearFilters(){
 search.value="";
 statusFilter.value="";
 typeFilter.value="";
 renderProjects();
}

search.addEventListener("input",renderProjects);
statusFilter.addEventListener("change",renderProjects);
typeFilter.addEventListener("change",renderProjects);

renderProjects();
window.addEventListener("storage",renderProjects);
</script>

</body>
</html>
