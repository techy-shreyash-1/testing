<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Leads | Affinity Admin</title>

<style>
:root{
  --blue:#1768d3;
  --blue-dark:#095dcc;
  --dark:#102b49;
  --text:#637589;
  --bg:#f5f9fd;
  --border:#e2ebf4;
  --white:#ffffff;
  --green:#198754;
  --orange:#d98512;
  --red:#d64545;
  --purple:#7952b3;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--dark);
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
  width:260px;
  min-height:100vh;
  position:fixed;
  top:0;
  left:0;
  background:#102b49;
  padding:28px 18px;
}

.logo{
  color:#ffffff;
  font-size:23px;
  font-weight:800;
  margin:0 12px 45px;
}

.logo span{
  color:#62a3ff;
}

.nav a{
  display:block;
  padding:15px;
  margin-bottom:8px;
  color:#c3d1df;
  text-decoration:none;
  border-radius:10px;
  font-weight:600;
  transition:.25s;
}

.nav a:hover,
.nav a.active{
  background:#1768d3;
  color:#ffffff;
}

/* =========================
   MAIN
========================= */

.main{
  margin-left:260px;
  min-height:100vh;
  padding:40px;
}

.page-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:20px;
  margin-bottom:28px;
}

.page-title h1{
  font-size:32px;
  color:var(--dark);
}

.page-title p{
  margin-top:8px;
  color:var(--text);
}

.add-btn{
  border:none;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:13px 20px;
  border-radius:10px;
  background:var(--blue);
  color:#ffffff;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  transition:.25s;
}

.add-btn:hover{
  background:var(--blue-dark);
}

/* =========================
   STATISTICS
========================= */

.stats-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:18px;
  margin-bottom:28px;
}

.stat-card{
  background:#ffffff;
  border:1px solid var(--border);
  border-radius:15px;
  padding:20px;
  box-shadow:0 8px 22px rgba(16,43,73,.05);
}

.stat-card span{
  display:block;
  color:var(--text);
  font-size:12px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.5px;
}

.stat-card strong{
  display:block;
  margin-top:10px;
  color:var(--dark);
  font-size:30px;
}

.stat-card.blue strong{color:var(--blue);}
.stat-card.orange strong{color:var(--orange);}
.stat-card.green strong{color:var(--green);}
.stat-card.purple strong{color:var(--purple);}

/* =========================
   FILTERS
========================= */

.filters{
  display:grid;
  grid-template-columns:2fr 1fr 1fr;
  gap:15px;
  padding:18px;
  margin-bottom:25px;
  background:#ffffff;
  border:1px solid var(--border);
  border-radius:15px;
}

.filters input,
.filters select,
.form-group input,
.form-group select,
.form-group textarea{
  width:100%;
  padding:13px 14px;
  border:1px solid #d9e4ee;
  border-radius:9px;
  outline:none;
  font-family:inherit;
  font-size:14px;
  color:var(--dark);
  background:#ffffff;
}

.filters input:focus,
.filters select:focus,
.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(23,104,211,.08);
}

/* =========================
   TABLE
========================= */

.table-card{
  overflow:hidden;
  background:#ffffff;
  border:1px solid var(--border);
  border-radius:16px;
  box-shadow:0 8px 25px rgba(16,43,73,.05);
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  min-width:950px;
  border-collapse:collapse;
}

thead{
  background:#f7faff;
}

th{
  padding:16px;
  text-align:left;
  color:#52677c;
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.5px;
}

td{
  padding:16px;
  border-top:1px solid #edf1f5;
  color:#52677c;
  font-size:14px;
}

.lead-name{
  color:var(--dark);
  font-weight:700;
}

.lead-email{
  margin-top:4px;
  color:#8292a2;
  font-size:12px;
}

.project-name{
  color:#1768d3;
  font-weight:700;
}

/* =========================
   STATUS
========================= */

.status-badge{
  display:inline-flex;
  align-items:center;
  padding:6px 10px;
  border-radius:20px;
  font-size:11px;
  font-weight:800;
}

.status-new{
  background:#eaf3ff;
  color:#095dcc;
}

.status-contacted{
  background:#fff4df;
  color:#b66c00;
}

.status-interested{
  background:#eaf8ef;
  color:#198754;
}

.status-closed{
  background:#f0eafa;
  color:#7952b3;
}

/* =========================
   ACTION BUTTONS
========================= */

.action-buttons{
  display:flex;
  gap:7px;
}

.action-btn{
  border:none;
  padding:8px 10px;
  border-radius:7px;
  font-size:12px;
  font-weight:700;
  cursor:pointer;
  transition:.2s;
}

.view-btn{
  background:#eef6ff;
  color:#1768d3;
}

.edit-btn{
  background:#fff4df;
  color:#b66c00;
}

.delete-btn{
  background:#fff0f0;
  color:#c63636;
}

.action-btn:hover{
  transform:translateY(-2px);
}

/* =========================
   EMPTY STATE
========================= */

.empty-state{
  padding:60px 20px;
  text-align:center;
}

.empty-icon{
  font-size:45px;
  margin-bottom:12px;
}

.empty-state h3{
  color:var(--dark);
  margin-bottom:8px;
}

.empty-state p{
  color:var(--text);
}

/* =========================
   MODAL
========================= */

.modal{
  display:none;
  position:fixed;
  z-index:1000;
  inset:0;
  padding:20px;
  background:rgba(10,30,50,.55);
  overflow-y:auto;
}

.modal.show{
  display:flex;
  align-items:center;
  justify-content:center;
}

.modal-box{
  width:100%;
  max-width:650px;
  max-height:95vh;
  overflow-y:auto;
  background:#ffffff;
  border-radius:18px;
  box-shadow:0 25px 70px rgba(0,0,0,.25);
}

.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:22px 25px;
  border-bottom:1px solid var(--border);
}

.modal-header h2{
  font-size:22px;
  color:var(--dark);
}

.close-modal{
  width:35px;
  height:35px;
  border:none;
  border-radius:8px;
  background:#f0f4f8;
  color:#52677c;
  font-size:20px;
  cursor:pointer;
}

.modal-body{
  padding:25px;
}

/* =========================
   FORM
========================= */

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}

.form-group{
  margin-bottom:0;
}

.form-group.full{
  grid-column:1/-1;
}

.form-group label{
  display:block;
  margin-bottom:8px;
  color:#34495e;
  font-size:13px;
  font-weight:700;
}

.form-group textarea{
  min-height:100px;
  resize:vertical;
}

.form-actions{
  display:flex;
  gap:12px;
  justify-content:flex-end;
  margin-top:25px;
}

.cancel-btn,
.save-btn{
  border:none;
  padding:12px 20px;
  border-radius:9px;
  cursor:pointer;
  font-size:14px;
  font-weight:700;
}

.cancel-btn{
  background:#edf2f7;
  color:#52677c;
}

.save-btn{
  background:var(--blue);
  color:#ffffff;
}

.save-btn:hover{
  background:var(--blue-dark);
}

/* =========================
   LEAD DETAILS
========================= */

.detail-row{
  display:grid;
  grid-template-columns:150px 1fr;
  gap:15px;
  padding:13px 0;
  border-bottom:1px solid #edf1f5;
}

.detail-label{
  color:#637589;
  font-size:13px;
  font-weight:700;
}

.detail-value{
  color:#263f59;
  font-size:14px;
  word-break:break-word;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:1200px){

  .stats-grid{
    grid-template-columns:repeat(3,1fr);
  }

}

@media(max-width:900px){

  .sidebar{
    width:220px;
  }

  .main{
    margin-left:220px;
    padding:30px;
  }

  .stats-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .filters{
    grid-template-columns:1fr 1fr;
  }

  .filters input{
    grid-column:1/-1;
  }

}

@media(max-width:700px){

  .sidebar{
    position:relative;
    width:100%;
    min-height:auto;
  }

  .logo{
    margin-bottom:20px;
  }

  .nav{
    display:flex;
    flex-wrap:wrap;
  }

  .nav a{
    flex:1;
    min-width:130px;
  }

  .main{
    margin-left:0;
    width:100%;
    padding:20px;
  }

  .page-top{
    flex-direction:column;
  }

  .add-btn{
    width:100%;
  }

  .stats-grid,
  .filters,
  .form-grid{
    grid-template-columns:1fr;
  }

  .filters input,
  .form-group.full{
    grid-column:auto;
  }

  .form-actions{
    flex-direction:column;
  }

  .cancel-btn,
  .save-btn{
    width:100%;
  }

  .detail-row{
    grid-template-columns:1fr;
    gap:5px;
  }

}
</style>
</head>

<body>

<!-- =========================
     SIDEBAR
========================= -->

<aside class="sidebar">

  <div class="logo">
    AFFINITY <span>ADMIN</span>
  </div>

  <nav class="nav">
    <a href="admin.html">🏠 Dashboard</a>
    <a href="add-project.html">➕ Add Project</a>
    <a href="all-projects.html">🏢 All Projects</a>
    <a href="leads.html" class="active">👥 Leads</a>
  </nav>

</aside>


<!-- =========================
     MAIN
========================= -->

<main class="main">

  <div class="page-top">

    <div class="page-title">
      <h1>Lead Management</h1>
      <p>Track, manage and follow up with your project enquiries.</p>
    </div>

    <button class="add-btn" onclick="openAddLeadModal()">
      + Add New Lead
    </button>

  </div>


  <!-- =========================
       STATISTICS
  ========================= -->

  <div class="stats-grid">

    <div class="stat-card blue">
      <span>Total Leads</span>
      <strong id="totalLeads">0</strong>
    </div>

    <div class="stat-card">
      <span>New Leads</span>
      <strong id="newLeads">0</strong>
    </div>

    <div class="stat-card orange">
      <span>Contacted</span>
      <strong id="contactedLeads">0</strong>
    </div>

    <div class="stat-card green">
      <span>Interested</span>
      <strong id="interestedLeads">0</strong>
    </div>

    <div class="stat-card purple">
      <span>Closed</span>
      <strong id="closedLeads">0</strong>
    </div>

  </div>


  <!-- =========================
       FILTERS
  ========================= -->

  <div class="filters">

    <input
      type="text"
      id="searchInput"
      placeholder="Search by name, email or phone..."
    >

    <select id="statusFilter">
      <option value="">All Status</option>
      <option value="New">New</option>
      <option value="Contacted">Contacted</option>
      <option value="Interested">Interested</option>
      <option value="Closed">Closed</option>
    </select>

    <select id="projectFilter">
      <option value="">All Projects</option>
    </select>

  </div>


  <!-- =========================
       LEADS TABLE
  ========================= -->

  <div class="table-card">

    <div class="table-wrap">

      <table>

        <thead>
          <tr>
            <th>Lead</th>
            <th>Phone</th>
            <th>Project</th>
            <th>Status</th>
            <th>Date</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody id="leadsTableBody">
        </tbody>

      </table>

    </div>

  </div>

</main>


<!-- =========================
     ADD / EDIT LEAD MODAL
========================= -->

<div class="modal" id="leadModal">

  <div class="modal-box">

    <div class="modal-header">

      <h2 id="leadModalTitle">
        Add New Lead
      </h2>

      <button
        class="close-modal"
        onclick="closeLeadModal()"
      >
        ×
      </button>

    </div>


    <div class="modal-body">

      <form id="leadForm">

        <input type="hidden" id="leadId">


        <div class="form-grid">


          <div class="form-group">

            <label>
              Full Name *
            </label>

            <input
              type="text"
              id="leadName"
              required
              placeholder="Enter full name"
            >

          </div>


          <div class="form-group">

            <label>
              Phone Number *
            </label>

            <input
              type="tel"
              id="leadPhone"
              required
              placeholder="Enter phone number"
            >

          </div>


          <div class="form-group">

            <label>
              Email
            </label>

            <input
              type="email"
              id="leadEmail"
              placeholder="Enter email address"
            >

          </div>


          <div class="form-group">

            <label>
              Interested Project
            </label>

            <select id="leadProject">
              <option value="">
                Select Project
              </option>
            </select>

          </div>


          <div class="form-group">

            <label>
              Lead Status *
            </label>

            <select id="leadStatus" required>
              <option value="New">New</option>
              <option value="Contacted">Contacted</option>
              <option value="Interested">Interested</option>
              <option value="Closed">Closed</option>
            </select>

          </div>


          <div class="form-group">

            <label>
              Lead Source
            </label>

            <select id="leadSource">
              <option value="Website">Website</option>
              <option value="Phone Call">Phone Call</option>
              <option value="WhatsApp">WhatsApp</option>
              <option value="Walk-in">Walk-in</option>
              <option value="Facebook">Facebook</option>
              <option value="Instagram">Instagram</option>
              <option value="Referral">Referral</option>
              <option value="Other">Other</option>
            </select>

          </div>


          <div class="form-group full">

            <label>
              Message / Requirements
            </label>

            <textarea
              id="leadMessage"
              placeholder="Enter customer requirements..."
            ></textarea>

          </div>


        </div>


        <div class="form-actions">

          <button
            type="button"
            class="cancel-btn"
            onclick="closeLeadModal()"
          >
            Cancel
          </button>

          <button
            type="submit"
            class="save-btn"
          >
            Save Lead
          </button>

        </div>

      </form>

    </div>

  </div>

</div>


<!-- =========================
     LEAD DETAILS MODAL
========================= -->

<div class="modal" id="detailsModal">

  <div class="modal-box">

    <div class="modal-header">

      <h2>
        Lead Details
      </h2>

      <button
        class="close-modal"
        onclick="closeDetailsModal()"
      >
        ×
      </button>

    </div>

    <div
      class="modal-body"
      id="leadDetailsContent"
    >
    </div>

  </div>

</div>


<script>

/* =========================
   STORAGE FUNCTIONS
========================= */

function getLeads(){

  return JSON.parse(
    localStorage.getItem("affinityLeads")
  ) || [];

}


function getProjects(){

  return JSON.parse(
    localStorage.getItem("affinityProjects")
  ) || [];

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

  if(value === null || value === undefined){
    return "";
  }

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================
   LOAD PROJECT DROPDOWNS
========================= */

function loadProjectDropdowns(){

  const projects =
    getProjects();


  const filter =
    document.getElementById("projectFilter");


  const leadProject =
    document.getElementById("leadProject");


  const currentFilter =
    filter.value;


  filter.innerHTML =
    `<option value="">All Projects</option>`;


  leadProject.innerHTML =
    `<option value="">Select Project</option>`;


  projects.forEach(function(project){

    const projectName =
      project.name || "Unnamed Project";


    filter.innerHTML += `

      <option value="${escapeHTML(projectName)}">
        ${escapeHTML(projectName)}
      </option>

    `;


    leadProject.innerHTML += `

      <option value="${escapeHTML(projectName)}">
        ${escapeHTML(projectName)}
      </option>

    `;

  });


  filter.value =
    currentFilter;

}


/* =========================
   UPDATE STATISTICS
========================= */

function updateStats(){

  const leads =
    getLeads();


  document
  .getElementById("totalLeads")
  .textContent =
    leads.length;


  document
  .getElementById("newLeads")
  .textContent =
    leads.filter(
      lead => lead.status === "New"
    ).length;


  document
  .getElementById("contactedLeads")
  .textContent =
    leads.filter(
      lead => lead.status === "Contacted"
    ).length;


  document
  .getElementById("interestedLeads")
  .textContent =
    leads.filter(
      lead => lead.status === "Interested"
    ).length;


  document
  .getElementById("closedLeads")
  .textContent =
    leads.filter(
      lead => lead.status === "Closed"
    ).length;

}


/* =========================
   STATUS CLASS
========================= */

function getStatusClass(status){

  return String(status)
    .toLowerCase()
    .replace(/\s+/g,"-");

}


/* =========================
   RENDER LEADS
========================= */

function renderLeads(){

  const tableBody =
    document.getElementById("leadsTableBody");


  const search =
    document
    .getElementById("searchInput")
    .value
    .toLowerCase()
    .trim();


  const selectedStatus =
    document
    .getElementById("statusFilter")
    .value;


  const selectedProject =
    document
    .getElementById("projectFilter")
    .value;


  let leads =
    getLeads();


  leads =
    leads.filter(function(lead){

      const name =
        (lead.name || "").toLowerCase();

      const email =
        (lead.email || "").toLowerCase();

      const phone =
        (lead.phone || "").toLowerCase();


      const searchMatch =
        !search ||
        name.includes(search) ||
        email.includes(search) ||
        phone.includes(search);


      const statusMatch =
        !selectedStatus ||
        lead.status === selectedStatus;


      const projectMatch =
        !selectedProject ||
        lead.project === selectedProject;


      return
        searchMatch &&
        statusMatch &&
        projectMatch;

    });


  /* Empty state */

  if(leads.length === 0){

    tableBody.innerHTML = `

      <tr>

        <td
          colspan="6"
          class="empty-state"
        >

          <div class="empty-icon">
            👥
          </div>

          <h3>
            No Leads Found
          </h3>

          <p>
            Add a new lead or change your filters.
          </p>

        </td>

      </tr>

    `;

    return;

  }


  /* Sort newest first */

  leads.sort(function(a,b){

    return Number(b.id) - Number(a.id);

  });


  tableBody.innerHTML =
    leads.map(function(lead){

      return `

        <tr>

          <td>

            <div class="lead-name">
              ${escapeHTML(lead.name)}
            </div>

            ${
              lead.email
                ? `
                  <div class="lead-email">
                    ${escapeHTML(lead.email)}
                  </div>
                `
                : ""
            }

          </td>


          <td>
            ${escapeHTML(lead.phone)}
          </td>


          <td>
            <span class="project-name">
              ${escapeHTML(
                lead.project || "Not Selected"
              )}
            </span>
          </td>


          <td>

            <span
              class="status-badge status-${getStatusClass(lead.status)}"
            >
              ${escapeHTML(lead.status)}
            </span>

          </td>


          <td>
            ${escapeHTML(
              lead.createdAt || "-"
            )}
          </td>


          <td>

            <div class="action-buttons">

              <button
                class="action-btn view-btn"
                onclick="viewLead(${Number(lead.id)})"
              >
                View
              </button>


              <button
                class="action-btn edit-btn"
                onclick="editLead(${Number(lead.id)})"
              >
                Edit
              </button>


              <button
                class="action-btn delete-btn"
                onclick="deleteLead(${Number(lead.id)})"
              >
                Delete
              </button>

            </div>

          </td>

        </tr>

      `;

    }).join("");

}


/* =========================
   OPEN ADD MODAL
========================= */

function openAddLeadModal(){

  document
  .getElementById("leadForm")
  .reset();


  document
  .getElementById("leadId")
  .value =
    "";


  document
  .getElementById("leadModalTitle")
  .textContent =
    "Add New Lead";


  loadProjectDropdowns();


  document
  .getElementById("leadModal")
  .classList.add("show");

}


/* =========================
   CLOSE LEAD MODAL
========================= */

function closeLeadModal(){

  document
  .getElementById("leadModal")
  .classList.remove("show");

}


/* =========================
   SAVE LEAD
========================= */

document
.getElementById("leadForm")
.addEventListener("submit", function(e){

  e.preventDefault();


  let leads =
    getLeads();


  const leadId =
    document
    .getElementById("leadId")
    .value;


  const leadData = {

    id:
      leadId
        ? Number(leadId)
        : Date.now(),


    name:
      document
      .getElementById("leadName")
      .value
      .trim(),


    phone:
      document
      .getElementById("leadPhone")
      .value
      .trim(),


    email:
      document
      .getElementById("leadEmail")
      .value
      .trim(),


    project:
      document
      .getElementById("leadProject")
      .value,


    status:
      document
      .getElementById("leadStatus")
      .value,


    source:
      document
      .getElementById("leadSource")
      .value,


    message:
      document
      .getElementById("leadMessage")
      .value
      .trim(),


    createdAt:
      new Date().toLocaleString()

  };


  /* Update */

  if(leadId){

    leads =
      leads.map(function(lead){

        if(Number(lead.id) === Number(leadId)){

          return {
            ...lead,
            ...leadData,
            createdAt:
              lead.createdAt
          };

        }

        return lead;

      });

  }

  /* Add */

  else{

    leads.push(leadData);

  }


  localStorage.setItem(
    "affinityLeads",
    JSON.stringify(leads)
  );


  closeLeadModal();

  updateStats();

  renderLeads();

});


/* =========================
   EDIT LEAD
========================= */

function editLead(leadId){

  const leads =
    getLeads();


  const lead =
    leads.find(
      item =>
        Number(item.id) === Number(leadId)
    );


  if(!lead){
    alert("Lead not found.");
    return;
  }


  loadProjectDropdowns();


  document
  .getElementById("leadId")
  .value =
    lead.id;


  document
  .getElementById("leadName")
  .value =
    lead.name || "";


  document
  .getElementById("leadPhone")
  .value =
    lead.phone || "";


  document
  .getElementById("leadEmail")
  .value =
    lead.email || "";


  document
  .getElementById("leadProject")
  .value =
    lead.project || "";


  document
  .getElementById("leadStatus")
  .value =
    lead.status || "New";


  document
  .getElementById("leadSource")
  .value =
    lead.source || "Website";


  document
  .getElementById("leadMessage")
  .value =
    lead.message || "";


  document
  .getElementById("leadModalTitle")
  .textContent =
    "Edit Lead";


  document
  .getElementById("leadModal")
  .classList.add("show");

}


/* =========================
   DELETE LEAD
========================= */

function deleteLead(leadId){

  const confirmDelete =
    confirm(
      "Are you sure you want to delete this lead?"
    );


  if(!confirmDelete){
    return;
  }


  let leads =
    getLeads();


  leads =
    leads.filter(
      lead =>
        Number(lead.id) !== Number(leadId)
    );


  localStorage.setItem(
    "affinityLeads",
    JSON.stringify(leads)
  );


  updateStats();

  renderLeads();

}

/* =========================

========================= */

  .getElementById("detailsModal")
  .classList.remove("show");

/* =========================
   FILTER EVENTS
========================= */

document
.getElementById("searchInput")
.addEventListener(
  "input",
  renderLeads
);


document
.getElementById("statusFilter")
.addEventListener(
  "change",
  renderLeads
);


document
.getElementById("projectFilter")
.addEventListener(
  "change",
  renderLeads
);


/* =========================
   CLOSE MODAL ON BACKGROUND
========================= */

window.addEventListener(
  "click",
  function(e){

    const leadModal =
      document.getElementById("leadModal");

    const detailsModal =
      document.getElementById("detailsModal");


    if(e.target === leadModal){
      closeLeadModal();
    }


    if(e.target === detailsModal){
      closeDetailsModal();
    }

  }
);

========================= */

loadProjectDropdowns();

updateStats();

renderLeads();
