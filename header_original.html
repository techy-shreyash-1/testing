<style>
  /* ---- Fix: right-side gray gap on mobile ----
     Root cause: html/body render narrower than the real device width
     (common WordPress/page-builder mobile fallback), while position:fixed
     elements (bottom nav, sheet) are pinned to the true viewport and so
     stay full width — leaving a gray strip next to everything else.
     Forcing html/body to the actual device width fixes it site-wide. */
  html {
    width: 100vw;
    max-width: 100vw;
    overflow-x: clip;
  }
  body {
    width: 100%;
    max-width: 100vw;
    margin: 0;
    overflow-x: clip;
  }
  *, *::before, *::after {
    box-sizing: border-box;
  }

  .hdr {
    position: sticky;
    top: 0;
    z-index: 100;
    background: #ffffff;
    border-bottom: 1px solid #e4e9ef;
    font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
    width: 100%;
  }
  .hdr-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 32px 16px 0;
    max-width: 1240px;
    margin: 0 auto;
  }
  .hdr-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: inherit;
  }
  .hdr-logo-mark {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: linear-gradient(135deg, #1c5ea8, #0d2846);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    overflow: hidden;
  }
  .hdr-logo-mark img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .hdr-logo-text .name {
    font-size: 1.15rem;
    font-weight: 800;
    color: #0d2846;
    letter-spacing: .03em;
    line-height: 1.1;
  }
  .hdr-logo-text .tag {
    font-size: .68rem;
    color: #5b6b7c;
    letter-spacing: .02em;
  }
  .hdr-right {
    display: flex;
    align-items: center;
    gap: 34px;
  }
  .hdr-links {
    display: flex;
    align-items: center;
    gap: 34px;
    list-style: none;
  }
  .hdr-links a {
    font-size: .93rem;
    font-weight: 500;
    color: #1c2b3a;
    text-decoration: none;
    position: relative;
    padding-bottom: 6px;
  }
  .hdr-links a.active {
    color: #1c5ea8;
    font-weight: 700;
  }
  .hdr-links a.active::after {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 2px;
    background: #1c5ea8;
  }
  .hdr-links a:hover {
    color: #1c5ea8;
  }
  .hdr-link-icon {
    display: none;
  }
  .hdr-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 13px 24px;
    border-radius: 8px;
    font-weight: 600;
    font-size: .95rem;
    border: 1.5px solid transparent;
    transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
    white-space: nowrap;
    text-decoration: none;
    cursor: pointer;
  }
  .hdr-btn-primary {
    background: #1c5ea8;
    color: #ffffff;
  }
  .hdr-btn-primary:hover {
    background: #0d2846;
    box-shadow: 0 10px 24px rgba(13,40,70,.28);
    transform: translateY(-2px);
  }
  .hdr-btn-login {
    background: transparent;
    color: #1c5ea8;
    border-color: #1c5ea8;
    padding: 11px 20px;
  }
  .hdr-btn-login:hover {
    background: #1c5ea8;
    color: #fff;
    transform: translateY(-2px);
  }
  .hdr-burger {
    display: none;
    background: none;
    border: none;
    flex-direction: column;
    gap: 5px;
    cursor: pointer;
  }
  .hdr-burger span {
    width: 24px;
    height: 2px;
    background: #0d2846;
    display: block;
  }
  .hdr-btns-wrap {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  @media (max-width: 760px) {
    .hdr-nav {
      flex-wrap: nowrap;
      padding: 14px 20px;
    }
    .hdr-right {
      gap: 10px;
      width: auto;
      justify-content: flex-end;
    }
    .hdr-links {
      position: fixed;
      top: auto;
      bottom: 70px;
      left: 0;
      right: 0;
      background: #fff;
      flex-direction: column;
      padding: 20px 32px;
      gap: 18px;
      border-top: 1px solid #e4e9ef;
      border-bottom: none;
      box-shadow: 0 -8px 24px rgba(10,31,61,0.12);
      display: none;
    }
    .hdr-links.open {
      display: flex;
    }
    .hdr-links a {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .hdr-link-icon {
      display: inline-flex;
      width: 18px;
      height: 18px;
      stroke-width: 2;
      flex-shrink: 0;
    }
    .hdr-burger {
      display: none;
    }
    .hdr-logo-mark {
      width: 32px;
      height: 32px;
    }
    .hdr-logo-text .name {

    }
    .hdr-logo-text .tag {
      font-size: .62rem;
    }
    .hdr-btn {
      padding: 10px 16px;
      font-size: .85rem;
    }
    .hdr-btn-login {

      font-size: .85rem;
      width: 90px;
      justify-content: center;
    }
    .hdr-btn-primary {
      display: none;
    }
  }
  @media (max-width: 420px) {
    .hdr-logo-text .tag {
      font-size: .58rem;
    }
    .hdr-btn {
      padding: 9px 13px;
      font-size: .8rem;
    }
  }

  /* ---- Mobile-only bottom nav bar ---- */
  .hdr-bottom-nav {
    display: none;
  }

  @media (max-width: 760px) {
    .hdr-bottom-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 100;
      background: #ffffff;
      border-top: 1px solid #e4e9ef;
      padding: 8px 14px calc(8px + env(safe-area-inset-bottom));
      font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
      width: 100vw;
      max-width: 100vw;
      /* FIX: split overflow so the raised call button (negative margin-top)
         isn't clipped at the top, while still preventing horizontal gray gap */
      overflow-x: hidden;
      overflow-y: visible;
    }
    .hdr-bottom-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      color: #5b6b7c;
      text-decoration: none;
      font-size: .68rem;
      font-weight: 600;
      flex: 1 1 0;
      min-width: 0;
      max-width: 100%;
      padding: 0;
      background: none;
      border: none;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .hdr-bottom-item svg {
      width: 22px;
      height: 22px;
      stroke: #5b6b7c;
      fill: none;
      stroke-width: 2;
    }
    .hdr-bottom-item.active,
    .hdr-bottom-item:hover {
      color: #1c5ea8;
    }
    .hdr-bottom-item.active svg,
    .hdr-bottom-item:hover svg {
      stroke: #1c5ea8;
    }
    .hdr-bottom-call {
      flex: 0 0 auto;
      width: 62px;
      margin-top: -15px;
      padding-bottom: 0;
      margin-bottom: calc(-8px - env(safe-area-inset-bottom));
      overflow: visible;
    }
    .hdr-bottom-call-circle {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: #1c5ea8;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(28,94,168,0.4);
      border: 4px solid #ffffff;
      margin: 0 auto;
    }
    .hdr-bottom-call-circle svg {
      width: 16px;
      height: 16px;
      stroke: #ffffff;
      flex-shrink: 0;
    }
    body {
      padding-bottom: 70px;
    }
  }

  /* ---- Mobile-only "All sections" bottom sheet ---- */
  .hdr-sheet-backdrop {
    display: none;
  }

  @media (max-width: 760px) {
    .hdr-sheet-backdrop {
      display: block;
      position: fixed;
      inset: 0;
      background: rgba(10, 20, 35, 0.45);
      z-index: 199;
      opacity: 0;

    .hdr-sheet-backdrop.open {

      visibility: visible;
    }
    .hdr-sheet {

      left: 0;
      right: 0;
      bottom: 0;
      z-index: 200;
      background: #ffffff;
      border-radius: 20px 20px 0 0;

    }

      width: 40px;
      height: 4px;
      border-radius: 2px;
      background: #d5dbe3;
      margin: 6px auto 18px;
    }

      justify-content: center;

      border: none;
      cursor: pointer;
      flex-shrink: 0;
      padding: 0;
    }
    .hdr-sheet-close:hover {

    }
    .hdr-sheet-close svg {
      width: 15px;
      height: 15px;
      stroke: #14202e;
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      display: block;
    }
    .hdr-sheet-item {
      display: flex;
      align-items: center;
      gap: 18px;
      width: 100%;
      background: none;
      border: none;
      padding: 14px 0;
      text-align: left;
      text-decoration: none;
      cursor: pointer;
    }
    .hdr-sheet-item + .hdr-sheet-item {
      border-top: 1px solid #eef1f5;
    }
    .hdr-sheet-icon {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
      stroke: #0d2846;
      fill: none;
      stroke-width: 2;
    }
    .hdr-sheet-label {
      font-size: 1.02rem;
      font-weight: 700;
      color: #14202e;
    }
  }
</style>

<script>
  // Header JavaScript
  (function() {
    var burger = document.getElementById('hdrBurger');
    var navLinks = document.getElementById('hdrLinks');
    var bottomMenuBtn = document.getElementById('hdrBottomMenuBtn');
    var sheetBackdrop = document.getElementById('hdrSheetBackdrop');
    var sheet = document.getElementById('hdrSheet');
    var sheetClose = document.getElementById('hdrSheetClose');
    
    if (burger && navLinks) {
      burger.addEventListener('click', function() {
        navLinks.classList.toggle('open');
      });
      
      navLinks.querySelectorAll('a').forEach(function(link) {
        link.addEventListener('click', function() {
          navLinks.classList.remove('open');
        });
      });
    }

    // Mobile bottom-nav "Menu" button opens the "All sections" bottom sheet
    if (bottomMenuBtn && sheetBackdrop) {
      bottomMenuBtn.addEventListener('click', function() {
        sheetBackdrop.classList.add('open');
      });

      sheetBackdrop.addEventListener('click', function(e) {
        if (e.target === sheetBackdrop) {
          sheetBackdrop.classList.remove('open');
        }
      });

      if (sheetClose) {
        sheetClose.addEventListener('click', function() {
          sheetBackdrop.classList.remove('open');
        });
      }

      sheetBackdrop.querySelectorAll('.hdr-sheet-item').forEach(function(item) {
        item.addEventListener('click', function() {
          sheetBackdrop.classList.remove('open');
        });
      });
    }

    // Active nav link highlight on scroll
    var sections = document.querySelectorAll('section[id]');
    var navAnchors = document.querySelectorAll('.hdr-links a');
    
    window.addEventListener('scroll', function() {
      var current = '';
      sections.forEach(function(sec) {
        var top = sec.offsetTop - 120;
        if (window.scrollY >= top) current = sec.getAttribute('id');
      });
      navAnchors.forEach(function(a) {
        a.classList.remove('active');
        if (a.getAttribute('href') === '#' + current) a.classList.add('active');
      });
    });
  })();
</script>
