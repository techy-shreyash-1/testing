<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Affinity Admin | Leads</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f4f7fb;color:#1d3553}
.app{display:flex;min-height:100vh}
.sidebar{
 width:280px;background:#18324d;color:#fff;padding:30px 20px;
 position:fixed;height:100vh
}
.logo{font-size:28px;font-weight:900;margin:10px 15px 45px}
.logo span{color:#78a9f5}
.nav a{
 display:block;padding:17px 20px;margin:8px 0;border-radius:12px;
 color:#c8d5e5;text-decoration:none;font-weight:bold
}
.nav a:hover,.nav a.active{background:#2865b7;color:#fff}
.main{margin-left:280px;width:calc(100% - 280px);padding:35px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}
.top h1{font-size:34px}.top p{color:#6c7c8f;margin-top:8px}
.btn{
 border:0;background:#2464b7;color:#fff;padding:14px 22px;border-radius:12px;
 font-weight:bold;cursor:pointer
}
.filters{
 display:grid;grid-template-columns:2fr 1fr auto;gap:15px;margin-bottom:25px
}
input,select,textarea{
 padding:14px;border:1px solid #d9e2ec;border-radius:10px;font:inherit;width:100%
}
.table-wrap{
 background:#fff;border:1px solid #e1e8f0;border-radius:18px;overflow:auto
}
table{width:100%;border-collapse:collapse;min-width:900px}
th,td{padding:18px;text-align:left;border-bottom:1px solid #edf1f5}
th{font-size:12px;color:#697b8d;letter-spacing:1px}
.status{
 padding:8px 11px;border-radius:20px;border:0;font-weight:bold
}
.New{background:#fff0d7;color:#a96400}
.Contacted{background:#e8f2ff;color:#2464b7}
.Interested{background:#f1eaff;color:#7654b8}
.SiteVisit{background:#e9f8f0;color:#168358}
.Negotiation{background:#fff0e8;color:#b45309}
.Booked{background:#e4f7ed;color:#087744}
.modal{
 display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);
 align-items:center;justify-content:center;padding:20px
}
.modal-box{
 background:#fff;width:min(600px,100%);border-radius:20px;padding:30px;
 max-height:90vh;overflow:auto
}
.modal-box h2{margin-bottom:20px}
.field{margin-bottom:15px}
.field label{display:block;font-weight:bold;margin-bottom:7px}
.actions{display:flex;gap:10px;margin-top:20px}
.cancel{background:#e8edf3;color:#29425d}
.empty{text-align:center;padding:80px;color:#6d7e90}
@media(max-width:800px){
 .sidebar{position:static;width:100%;height:auto}.app{display:block}
 .main{margin:0;width:100%;padding:20px}.filters{grid-template-columns:1fr}
 .top{flex-direction:column;align-items:flex-start;gap:15px}
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar">
 <div class="logo">AFFINITY <span>ADMIN</span></div>
 <nav class="nav">
  <a href="admin.html">🏠 Dashboard</a>
  <a href="add-project.html">➕ Add Project</a>
  <a href="all-project.html">🏢 All Projects</a>
  <a class="active" href="leads.html">👥 Leads</a>
 </nav>
</aside>

<main class="main">

<div class="top">
 <div>
  <h1>Leads</h1>
  <p>Manage customer enquiries and update lead status.</p>
 </div>
 <button class="btn" onclick="openLead()">+ Add Lead</button>
</div>

<div class="filters">
 <input id="search" placeholder="Search name, phone, email or project...">
 <select id="statusFilter">
  <option value="">All Lead Status</option>
  <option>New</option>
  <option>Contacted</option>
  <option>Interested</option>
  <option>Site Visit</option>
  <option>Negotiation</option>
  <option>Booked</option>
 </select>
 <button class="btn" onclick="clearFilters()">Clear</button>
</div>

<div class="table-wrap">
<table>
<thead>
<tr>
 <th>CUSTOMER</th>
 <th>PHONE</th>
 <th>PROJECT</th>
 <th>DATE</th>
 <th>STATUS</th>
 <th>ACTION</th>
</tr>
</thead>
<tbody id="leadsBox"></tbody>
</table>
</div>

</main>
</div>

<div class="modal" id="leadModal">
 <div class="modal-box">
  <h2 id="modalTitle">Add Lead</h2>

  <input type="hidden" id="leadId">

  <div class="field">
   <label>Name *</label>
   <input id="leadName" placeholder="Customer name">
  </div>

  <div class="field">
   <label>Phone *</label>
   <input id="leadPhone" placeholder="Phone number">
  </div>

  <div class="field">
   <label>Email</label>
   <input id="leadEmail" type="email" placeholder="Email address">
  </div>

  <div class="field">
   <label>Interested Project</label>
   <select id="leadProject"></select>
  </div>

  <div class="field">
   <label>Status</label>
   <select id="leadStatus">
    <option>New</option>
    <option>Contacted</option>
    <option>Interested</option>
    <option>Site Visit</option>
    <option>Negotiation</option>
    <option>Booked</option>
   </select>
  </div>

  <div class="field">
   <label>Message / Notes</label>
   <textarea id="leadMessage" rows="4"></textarea>
  </div>

  <div class="actions">
   <button class="btn" onclick="saveLead()">Save Lead</button>
   <button class="btn cancel" onclick="closeLead()">Cancel</button>
  </div>
 </div>
</div>

<script>
function getLeads(){
 return JSON.parse(localStorage.getItem("affinityLeads") || "[]");
}
function saveLeads(leads){
 localStorage.setItem("affinityLeads",JSON.stringify(leads));
}
function getProjects(){
 return JSON.parse(localStorage.getItem("affinityProjects") || "[]");
}

function loadProjectOptions(selected=""){
 leadProject.innerHTML='<option value="">General Enquiry</option>'+
 getProjects().map(p=>`
   <option ${p.name===selected?"selected":""}>${p.name}</option>
 `).join("");
}

function renderLeads(){
 const search=document.getElementById("search").value.toLowerCase();
 const filter=document.getElementById("statusFilter").value;

 const leads=getLeads().filter(l=>{
   const text=[l.name,l.phone,l.email,l.project].join(" ").toLowerCase();
   return (!search || text.includes(search))
     &&(!filter || l.status===filter);
 });

 const box=document.getElementById("leadsBox");

 if(!leads.length){
   box.innerHTML=`<tr><td colspan="6" class="empty">
   <h2>No Leads Yet</h2><br>Customer enquiries will appear here.
   </td></tr>`;
   return;
 }

 box.innerHTML=leads.sort((a,b)=>b.createdAt-a.createdAt).map(l=>`
 <tr>
  <td>
   <b>${l.name}</b><br>
   <small>${l.email||""}</small>
  </td>
  <td>${l.phone}</td>
  <td>${l.project||"General Enquiry"}</td>
  <td>${new Date(l.createdAt).toLocaleDateString()}</td>
  <td>
   <select class="status ${String(l.status).replace(" ","")}"
     onchange="changeStatus('${l.id}',this.value)">
    ${["New","Contacted","Interested","Site Visit","Negotiation","Booked"]
      .map(s=>`<option ${l.status===s?"selected":""}>${s}</option>`).join("")}
   </select>
  </td>
  <td>
   <button class="btn" style="padding:9px 13px" onclick="editLead('${l.id}')">Edit</button>
   <button class="btn" style="padding:9px 13px;background:#cf4141" onclick="deleteLead('${l.id}')">Delete</button>
  </td>
 </tr>
 `).join("");
}

function openLead(){
 leadId.value="";
 leadName.value="";
 leadPhone.value="";
 leadEmail.value="";
 leadMessage.value="";
 leadStatus.value="New";
 modalTitle.textContent="Add Lead";
 loadProjectOptions();
 leadModal.style.display="flex";
}

function closeLead(){
 leadModal.style.display="none";
}

function editLead(id){
 const lead=getLeads().find(l=>l.id===id);
 if(!lead)return;

 modalTitle.textContent="Edit Lead";
 leadId.value=lead.id;
 leadName.value=lead.name;
 leadPhone.value=lead.phone;
 leadEmail.value=lead.email||"";
 leadMessage.value=lead.message||"";
 leadStatus.value=lead.status||"New";
 loadProjectOptions(lead.project);
 leadModal.style.display="flex";
}

function saveLead(){
 if(!leadName.value.trim() || !leadPhone.value.trim()){
   alert("Please enter customer name and phone number.");
   return;
 }

 const leads=getLeads();
 const id=leadId.value || "lead_"+Date.now();

 const data={
   id,
   name:leadName.value.trim(),
   phone:leadPhone.value.trim(),
   email:leadEmail.value.trim(),
   project:leadProject.value,
   status:leadStatus.value,
   message:leadMessage.value.trim(),
   createdAt:Date.now()
 };

 const index=leads.findIndex(l=>l.id===id);

 if(index>-1){
   data.createdAt=leads[index].createdAt;
   leads[index]=data;
 }else{
   leads.push(data);
 }

 saveLeads(leads);
 closeLead();
 renderLeads();
}

function changeStatus(id,status){
 const leads=getLeads();
 const lead=leads.find(l=>l.id===id);
 if(lead){
   lead.status=status;
   saveLeads(leads);
   renderLeads();
 }
}

function deleteLead(id){
 if(confirm("Delete this lead?")){
   saveLeads(getLeads().filter(l=>l.id!==id));
   renderLeads();
 }
}

function clearFilters(){
 search.value="";
 statusFilter.value="";
 renderLeads();
}

search.addEventListener("input",renderLeads);
statusFilter.addEventListener("change",renderLeads);

renderLeads();
</script>

</body>
</html>
