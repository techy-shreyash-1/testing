<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>All Projects | Affinity Realty Admin</title>

<style>
:root{
  --blue:#1768d3;
  --blue-dark:#095dcc;
  --dark:#102b49;
  --dark-2:#173b5c;
  --text:#637589;
  --light:#f5f9fd;
  --white:#ffffff;
  --border:#e2ebf4;
  --green:#198754;
  --purple:#7952b3;
  --red:#dc3545;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:"Segoe UI",Arial,Helvetica,sans-serif;
  background:var(--light);
  color:var(--dark);
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
  position:fixed;
  top:0;
  left:0;
  width:260px;
  height:100vh;
  padding:28px 18px;
  background:linear-gradient(180deg,#102b49 0%,#0b2138 100%);
  z-index:1000;
}

.logo{
  margin:0 12px 45px;
  color:#ffffff;
  font-size:23px;
  font-weight:800;
  letter-spacing:.3px;
}

.logo span{
  color:#62a3ff;
}

.nav a{
  display:flex;
  align-items:center;
  gap:11px;
  margin-bottom:8px;
  padding:15px;
  border-radius:10px;
  color:#c3d1df;
  text-decoration:none;
  font-size:14px;
  font-weight:600;
  transition:.25s ease;
}

.nav a:hover,
.nav a.active{
  background:#1768d3;
  color:#ffffff;
}

/* =========================
   MAIN
========================= */

.main{
  margin-left:260px;
  min-height:100vh;
  padding:38px;
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  margin-bottom:30px;
}

.heading h1{
  font-size:32px;
  font-weight:800;
  color:var(--dark);
}

.heading p{
  margin-top:7px;
  color:var(--text);
  font-size:14px;
}

.add-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:48px;
  padding:0 20px;
  border-radius:10px;
  background:var(--blue);
  color:#ffffff;
  text-decoration:none;
  font-size:14px;
  font-weight:700;
  transition:.25s ease;
}

.add-btn:hover{
  background:var(--blue-dark);
  transform:translateY(-2px);
}

/* =========================
   FILTERS
========================= */

.filter-box{
  display:grid;
  grid-template-columns:2fr 1fr 1fr auto;
  gap:15px;
  margin-bottom:25px;
  padding:20px;
  border:1px solid var(--border);
  border-radius:16px;
  background:var(--white);
  box-shadow:0 8px 25px rgba(16,43,73,.05);
}

.search-box,
.filter-select{
  width:100%;
  height:48px;
  padding:0 14px;
  border:1px solid var(--border);
  border-radius:10px;
  outline:none;
  background:#ffffff;
  color:#34495e;
  font-size:14px;
}

.search-box:focus,
.filter-select:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(23,104,211,.08);
}

.clear-btn{
  height:48px;
  padding:0 18px;
  border:1px solid var(--border);
  border-radius:10px;
  background:#ffffff;
  color:#637589;
  cursor:pointer;
  font-size:13px;
  font-weight:700;
  transition:.25s ease;
}

.clear-btn:hover{
  border-color:var(--blue);
  color:var(--blue);
}

/* =========================
   PROJECT INFO
========================= */

.project-info-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}

.project-count{
  color:#637589;
  font-size:14px;
}

.project-count strong{
  color:var(--blue);
}

/* =========================
   PROJECT GRID
========================= */

.projects-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:22px;
}

/* =========================
   PROJECT CARD
========================= */

.project-card{
  overflow:hidden;
  border:1px solid var(--border);
  border-radius:18px;
  background:#ffffff;
  box-shadow:0 8px 25px rgba(16,43,73,.06);
  transition:.3s ease;
}

.project-card:hover{
  transform:translateY(-6px);
  box-shadow:0 18px 38px rgba(16,43,73,.12);
}

.project-image{
  position:relative;
  height:210px;
  overflow:hidden;
  background:#eaf3fb;
}

.project-image img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  transition:transform .5s ease;
}

.project-card:hover .project-image img{
  transform:scale(1.06);
}

.status-badge{
  position:absolute;
  top:15px;
  left:15px;
  z-index:2;
  padding:7px 13px;
  border-radius:30px;
  background:#123b61;
  color:#ffffff;
  font-size:10px;
  font-weight:800;
  letter-spacing:.7px;
  text-transform:uppercase;
}

.status-ongoing{
  background:#1768d3;
}

.status-upcoming{
  background:#7952b3;
}

.status-completed{
  background:#198754;
}

/* =========================
   CARD BODY
========================= */

.project-body{
  padding:21px;
}

.project-name{
  margin-bottom:13px;
  color:var(--dark);
  font-size:21px;
  font-weight:800;
}

.project-location,
.project-type{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:10px;
  color:#637589;
  font-size:14px;
}

.project-description{
  margin:15px 0;
  padding-top:15px;
  border-top:1px solid #edf1f5;
  color:#718295;
  font-size:13px;
  line-height:1.6;
}

/* =========================
   OPTIONAL DETAILS
========================= */

.optional-details{
  margin-top:15px;
}

.optional-item{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
  padding:10px 0;
  border-top:1px solid #edf1f5;
}

.optional-label{
  color:#7a8997;
  font-size:12px;
  font-weight:700;
}

.optional-value{
  color:#31475c;
  text-align:right;
  font-size:12px;
  font-weight:700;
}

/* =========================
   OFFER
========================= */

.offer-box{
  margin-top:15px;
  padding:12px;
  border-radius:10px;
  background:#eef6ff;
  border:1px solid rgba(23,104,211,.12);
}

.offer-title{
  margin-bottom:5px;
  color:#1768d3;
  font-size:11px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.5px;
}

.offer-text{
  color:#31516f;
  font-size:13px;
  line-height:1.5;
}

/* =========================
   ACTIONS
========================= */

.project-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:20px;
}

.edit-btn,
.delete-btn{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:43px;
  border-radius:9px;
  cursor:pointer;
  font-size:13px;
  font-weight:800;
  transition:.25s ease;
}

.edit-btn{
  border:1px solid #cfe1f7;
  background:#eef6ff;
  color:#1768d3;
}

.edit-btn:hover{
  background:#1768d3;
  color:#ffffff;
}

.delete-btn{
  border:1px solid #f3c7cc;
  background:#fff4f5;
  color:#dc3545;
}

.delete-btn:hover{
  background:#dc3545;
  color:#ffffff;
}

/* =========================
   EMPTY STATE
========================= */

.empty-state{
  grid-column:1/-1;
  padding:70px 20px;
  border:1px solid var(--border);
  border-radius:18px;
  background:#ffffff;
  text-align:center;
}

.empty-icon{
  margin-bottom:15px;
  font-size:52px;
}

.empty-state h2{
  margin-bottom:8px;
  color:var(--dark);
  font-size:23px;
}

.empty-state p{
  margin-bottom:20px;
  color:#637589;
  font-size:14px;
}

.empty-btn{
  display:inline-flex;
  padding:12px 18px;
  border-radius:9px;
  background:#1768d3;
  color:#ffffff;
  text-decoration:none;
  font-size:13px;
  font-weight:800;
}

/* =========================
   EDIT MODAL
========================= */

.modal-overlay{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(5,20,35,.65);
  z-index:5000;
}

.modal-overlay.show{
  display:flex;
}

.modal{
  width:100%;
  max-width:760px;
  max-height:90vh;
  overflow-y:auto;
  padding:25px;
  border-radius:18px;
  background:#ffffff;
  box-shadow:0 25px 70px rgba(0,0,0,.25);
}

.modal-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:22px;
}

.modal-header h2{
  font-size:24px;
  color:var(--dark);
}

.close-btn{
  width:38px;
  height:38px;
  border:none;
  border-radius:50%;
  background:#eef3f8;
  color:#34495e;
  cursor:pointer;
  font-size:23px;
  line-height:1;
}

.edit-form{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

.form-group{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.form-group.full{
  grid-column:1/-1;
}

.form-group label{
  color:#41576c;
  font-size:13px;
  font-weight:700;
}

.form-group input,
.form-group select,
.form-group textarea{
  width:100%;
  padding:12px 13px;
  border:1px solid var(--border);
  border-radius:9px;
  outline:none;
  background:#ffffff;
  font-family:inherit;
  font-size:14px;
}

.form-group textarea{
  min-height:110px;
  resize:vertical;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{
  border-color:#1768d3;
  box-shadow:0 0 0 3px rgba(23,104,211,.08);
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  margin-top:24px;
}

.cancel-btn,
.save-btn{
  min-height:45px;
  padding:0 18px;
  border-radius:9px;
  cursor:pointer;
  font-size:13px;
  font-weight:800;
}

.cancel-btn{
  border:1px solid var(--border);
  background:#ffffff;
  color:#637589;
}

.save-btn{
  border:1px solid #1768d3;
  background:#1768d3;
  color:#ffffff;
}

.save-btn:hover{
  background:#095dcc;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:1200px){

  .projects-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .filter-box{
    grid-template-columns:1fr 1fr;
  }

}

@media(max-width:900px){

  .sidebar{
    width:220px;
  }

  .main{
    margin-left:220px;
    padding:28px;
  }

}

@media(max-width:700px){

  .sidebar{
    position:relative;
    width:100%;
    height:auto;
  }

  .logo{
    margin-bottom:20px;
  }

  .nav{
    display:flex;
    flex-wrap:wrap;
  }

  .nav a{
    flex:1;
    min-width:130px;
  }

  .main{
    margin-left:0;
    padding:20px;
  }

  .topbar{
    flex-direction:column;
    align-items:flex-start;
  }

  .filter-box{
    grid-template-columns:1fr;
  }

  .projects-grid{
    grid-template-columns:1fr;
  }

  .edit-form{
    grid-template-columns:1fr;
  }

  .form-group.full{
    grid-column:auto;
  }

}
</style>
</head>

<body>

<!-- =========================
     SIDEBAR
========================= -->

<aside class="sidebar">

  <div class="logo">
    AFFINITY <span>ADMIN</span>
  </div>

  <nav class="nav">
    <a href="admin.html">🏠 Dashboard</a>
    <a href="add-project.html">➕ Add Project</a>
    <a href="all-projects.html" class="active">🏢 All Projects</a>
    <a href="leads.html">👥 Leads</a>
  </nav>

<!-- =========================

========================= -->

<main class="main">

<!-- =========================
     EDIT PROJECT MODAL
========================= -->

<div class="modal-overlay" id="editModal">

  <div class="modal">

    <div class="modal-header">

      <h2>Edit Project</h2>

      <button
        type="button"
        class="close-btn"
        onclick="closeEditModal()"
      >
        ×
      </button>

    </div>


    <form id="editProjectForm">

      <input
        type="hidden"

      <div class="edit-form">

        <div class="form-group">

          <label for="editName">

          </label>

          <label for="editLocation">

          <input
            type="text"

          <label for="editStatus">

            id="editOffer"

          <label for="editDescription">

<!-- =========================
     JAVASCRIPT
========================= -->

<script>

/* =========================================
   STORAGE KEY
========================================= */

const STORAGE_KEY = "affinityProjects";


/* =========================================
   GET ALL PROJECTS
========================================= */

function getProjects(){

  try{

    const projects = JSON.parse(
      localStorage.getItem(STORAGE_KEY)
    );

    return Array.isArray(projects)
      ? projects
      : [];

  }catch(error){

    console.error(
      "Error loading projects:",
      error
    );

    return [];

  }

}


/* =========================================
   SAVE ALL PROJECTS
========================================= */

function saveProjects(projects){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(projects)
  );

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(value){

  if(
    value === null ||
    value === undefined
  ){
    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================
   GET PROJECT FIELD
   SUPPORTS OLD AND NEW ADD-PROJECT DATA
========================================= */

function getProjectName(project){

  return project.name ||
         project.projectName ||
         "";

}


function getProjectLocation(project){

  return project.location ||
         project.projectLocation ||
         "";

}


function getProjectType(project){

  return project.type ||
         project.propertyType ||
         project.projectType ||
         "Not specified";

}


function getProjectStatus(project){

  return project.status ||
         "Ongoing";

}


function getProjectImage(project){

  return project.image ||
         project.imageUrl ||
         project.projectImage ||
         "";

}


function getProjectDescription(project){

  return project.description ||
         project.projectDescription ||
         "";

}


function getBookingDate(project){

  return project.bookingDate ||
         project.bookingStartDate ||
         project.bookDate ||
         "";

}


function getOffer(project){

  return project.offer ||
         project.specialOffer ||
         project.offerDetails ||
         "";

}


/* =========================================
   FORMAT DATE
========================================= */

function formatDate(value){

  if(!value){
    return "";
  }

  const date = new Date(value);

  if(isNaN(date.getTime())){
    return value;
  }

  return date.toLocaleDateString(
    "en-IN",
    {
      day:"numeric",
      month:"long",
      year:"numeric"
    }
  );

}


/* =========================================
   POPULATE PROPERTY TYPE FILTER
========================================= */

function populateTypeFilter(){

  const typeFilter =
    document.getElementById("typeFilter");

  const selectedValue =
    typeFilter.value;

  const projects =
    getProjects();

  const types = [
    ...new Set(
      projects
        .map(
          project => getProjectType(project)
        )
        .filter(
          type =>
            type &&
            type !== "Not specified"
        )
    )
  ].sort();


  typeFilter.innerHTML =
    `<option value="">All Property Types</option>`;


  types.forEach(function(type){

    const option =
      document.createElement("option");

    option.value =
      type.toLowerCase();

    option.textContent =
      type;

    typeFilter.appendChild(option);

  });


  const optionExists =
    [...typeFilter.options].some(
      option =>
        option.value === selectedValue
    );


  if(optionExists){

    typeFilter.value =
      selectedValue;

  }

}


/* =========================================
   FILTER PROJECTS
========================================= */

function getFilteredProjects(){

  const search =
    document
      .getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();


  const selectedStatus =
    document
      .getElementById("statusFilter")
      .value
      .toLowerCase();


  const selectedType =
    document
      .getElementById("typeFilter")
      .value
      .toLowerCase();


  return getProjects()
    .filter(function(project){

      const name =
        getProjectName(project)
          .toLowerCase();

      const location =
        getProjectLocation(project)
          .toLowerCase();

      const status =
        getProjectStatus(project)
          .toLowerCase();

      const type =
        getProjectType(project)
          .toLowerCase();


      const searchMatch =
        !search ||
        name.includes(search) ||
        location.includes(search) ||
        type.includes(search);


      const statusMatch =
        !selectedStatus ||
        status === selectedStatus;


      const typeMatch =
        !selectedType ||
        type === selectedType;


      return
        searchMatch &&
        statusMatch &&
        typeMatch;

    })
    .sort(function(a,b){

      return Number(b.id || 0) -
             Number(a.id || 0);

    });

}


/* =========================================
   RENDER PROJECTS
========================================= */

function renderProjects(){

  const grid =
    document.getElementById("projectsGrid");


  const projects =
    getFilteredProjects();


  document
    .getElementById("showingCount")
    .textContent =
      projects.length;


  if(projects.length === 0){

    grid.innerHTML = `
      <div class="empty-state">

        <div class="empty-icon">🏗️</div>

        <h2>No Projects Found</h2>

        <p>
          No project matches your search.
          Add a new project to get started.
        </p>

        <a
          href="add-project.html"
          class="empty-btn"
        >
          + Add Project
        </a>

      </div>
    `;

    return;

  }


  grid.innerHTML =
    projects.map(function(project){

      const name =
        getProjectName(project);

      const location =
        getProjectLocation(project);

      const status =
        getProjectStatus(project);

      const type =
        getProjectType(project);

      const image =
        getProjectImage(project);

      const description =
        getProjectDescription(project);

      const bookingDate =
        getBookingDate(project);

      const offer =
        getOffer(project);


      const statusClass =
        status
          .toLowerCase()
          .replace(/\s+/g,"-");


      const safeId =
        String(project.id);


      return `
        <article class="project-card">

          <div class="project-image">

            <span
              class="status-badge status-${escapeHTML(statusClass)}"
            >
              ${escapeHTML(status)}
            </span>

            ${
              image
              ? `
                <img
                  src="${escapeHTML(image)}"
                  alt="${escapeHTML(name)}"
                  onerror="this.onerror=null;this.style.display='none';"
                >
              `
              : `
                <div style="
                  width:100%;
                  height:100%;
                  display:flex;
                  align-items:center;
                  justify-content:center;
                  color:#637589;
                  font-weight:700;
                ">
                  No Image Available
                </div>
              `
            }

          </div>


          <div class="project-body">

            <h2 class="project-name">
              ${escapeHTML(name || "Unnamed Project")}
            </h2>


            <div class="project-location">
              <span>📍</span>
              <span>
                ${escapeHTML(location || "Location not specified")}
              </span>
            </div>


            <div class="project-type">
              <span>🏢</span>
              <span>
                ${escapeHTML(type)}
              </span>
            </div>


            ${
              description
              ? `
                <div class="project-description">
                  ${escapeHTML(description)}
                </div>
              `
              : ""
            }


            ${
              bookingDate
              ? `
                <div class="optional-details">

                  <div class="optional-item">

                    <div class="optional-label">
                      Booking Starts
                    </div>

                    <div class="optional-value">
                      ${escapeHTML(formatDate(bookingDate))}
                    </div>

                  </div>

                </div>
              `
              : ""
            }


            ${
              offer
              ? `
                <div class="offer-box">

                  <div class="offer-title">
                    Special Offer
                  </div>

                  <div class="offer-text">
                    ${escapeHTML(offer)}
                  </div>

                </div>
              `
              : ""
            }


            <div class="project-actions">

              <button
                type="button"
                class="edit-btn"
                data-id="${escapeHTML(safeId)}"
                onclick="editProject(this.dataset.id)"
              >
                ✏️ Edit
              </button>


              <button
                type="button"
                class="delete-btn"
                data-id="${escapeHTML(safeId)}"
                onclick="deleteProject(this.dataset.id)"
              >
                🗑 Delete
              </button>

            </div>

          </div>

        </article>
      `;

    }).join("");

}


/* =========================================
   EDIT PROJECT
========================================= */

function editProject(id){

  const projects =
    getProjects();


  const project =
    projects.find(function(item){

      return String(item.id) === String(id);

    });


  if(!project){

    alert("Project not found.");
    return;

  }


  document
    .getElementById("editProjectId")
    .value =
      project.id;


  document
    .getElementById("editName")
    .value =
      getProjectName(project);


  document
    .getElementById("editLocation")
    .value =
      getProjectLocation(project);


  document
    .getElementById("editStatus")
    .value =
      getProjectStatus(project);


  document
    .getElementById("editType")
    .value =
      getProjectType(project) === "Not specified"
        ? ""
        : getProjectType(project);


  document
    .getElementById("editBookingDate")
    .value =
      getBookingDate(project);


  document
    .getElementById("editImage")
    .value =
      getProjectImage(project);


  document
    .getElementById("editOffer")
    .value =
      getOffer(project);


  document
    .getElementById("editDescription")
    .value =
      getProjectDescription(project);


  document
    .getElementById("editModal")
    .classList
    .add("show");

}


/* =========================================
   CLOSE EDIT MODAL
========================================= */

function closeEditModal(){

  document
    .getElementById("editModal")
    .classList
    .remove("show");

}


/* =========================================
   UPDATE PROJECT
========================================= */

document
  .getElementById("editProjectForm")
  .addEventListener(
    "submit",
    function(event){

      event.preventDefault();


      const projectId =
        document
          .getElementById("editProjectId")
          .value;


      const projects =
        getProjects();


      const projectIndex =
        projects.findIndex(function(item){

          return String(item.id) ===
                 String(projectId);

        });


      if(projectIndex === -1){

        alert("Project not found.");
        return;

      }


      const existingProject =
        projects[projectIndex];


      const name =
        document
          .getElementById("editName")
          .value
          .trim();


      const location =
        document
          .getElementById("editLocation")
          .value
          .trim();


      const status =
        document
          .getElementById("editStatus")
          .value;


      if(!name || !location || !status){

        alert(
          "Please fill Project Name, Location and Status."
        );

        return;

      }


      projects[projectIndex] = {

        ...existingProject,

        id: existingProject.id,

        name: name,

        location: location,

        status: status,

        type:
          document
            .getElementById("editType")
            .value
            .trim(),

        bookingDate:
          document
            .getElementById("editBookingDate")
            .value,

        image:
          document
            .getElementById("editImage")
            .value
            .trim(),

        offer:
          document
            .getElementById("editOffer")
            .value
            .trim(),

        description:
          document
            .getElementById("editDescription")
            .value
            .trim(),

        updatedAt:
          new Date().toISOString()

      };


      saveProjects(projects);


      closeEditModal();


      populateTypeFilter();


      renderProjects();


      alert("Project updated successfully!");

    }
  );


/* =========================================
   DELETE PROJECT
========================================= */

function deleteProject(id){

  const projects =
    getProjects();


  const project =
    projects.find(function(item){

      return String(item.id) ===
             String(id);

    });


  if(!project){

    alert("Project not found.");
    return;

  }


  const projectName =
    getProjectName(project) ||
    "this project";


  const confirmDelete =
    confirm(
      `Are you sure you want to delete "${projectName}"?`
    );


  if(!confirmDelete){
    return;
  }


  const updatedProjects =
    projects.filter(function(item){

      return String(item.id) !==
             String(id);

    });


  saveProjects(updatedProjects);


  populateTypeFilter();


  renderProjects();


  alert("Project deleted successfully.");

}


/* =========================================
   FILTER EVENTS
========================================= */

document
  .getElementById("searchInput")
  .addEventListener(
    "input",
    renderProjects
  );


document
  .getElementById("statusFilter")
  .addEventListener(
    "change",
    renderProjects
  );


document
  .getElementById("typeFilter")
  .addEventListener(
    "change",
    renderProjects
  );


/* =========================================
   CLEAR FILTERS
========================================= */

document
  .getElementById("clearFilters")
  .addEventListener(
    "click",
    function(){

      document
        .getElementById("searchInput")
        .value = "";


      document
        .getElementById("statusFilter")
        .value = "";


      document
        .getElementById("typeFilter")
        .value = "";


      renderProjects();

    }
  );


/* =========================================
   CLOSE MODAL OUTSIDE
========================================= */

document
  .getElementById("editModal")
  .addEventListener(
    "click",
    function(event){

      if(event.target === this){

        closeEditModal();

      }

    }
  );


/* =========================================
   ESC KEY CLOSE
========================================= */

document.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Escape"){

      closeEditModal();

    }

  }
);


/* =========================================
   REFRESH WHEN PAGE GETS FOCUS
========================================= */

window.addEventListener(
  "focus",
  function(){

    populateTypeFilter();
    renderProjects();

  }
);


/* =========================================
   REFRESH WHEN LOCAL STORAGE CHANGES
========================================= */

window.addEventListener(
  "storage",
  function(event){

    if(event.key === STORAGE_KEY){

      populateTypeFilter();
      renderProjects();

    }

  }
);


/* =========================================
   INITIAL LOAD
========================================= */

document.addEventListener(
  "DOMContentLoaded",
  function(){

    populateTypeFilter();
    renderProjects();

  }
);

</script>

</body>
</html>
