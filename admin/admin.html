<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Affinity Admin | Dashboard</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#1d3553;
}
.app{display:flex;min-height:100vh}
.sidebar{
  width:280px;background:#18324d;color:white;padding:30px 20px;
  position:fixed;height:100vh
}
.logo{font-size:28px;font-weight:900;letter-spacing:1px;margin:10px 15px 45px}
.logo span{color:#78a9f5}
.nav a{
  display:block;color:#c8d5e5;text-decoration:none;padding:17px 20px;
  margin:8px 0;border-radius:12px;font-weight:700
}
.nav a:hover,.nav a.active{background:#2865b7;color:#fff}
.main{margin-left:280px;width:calc(100% - 280px);padding:35px}
.top{
  display:flex;justify-content:space-between;align-items:center;margin-bottom:30px
}
.top h1{font-size:34px}
.top p{color:#6c7c8f;margin-top:8px}
.btn{
  border:0;background:#2464b7;color:#fff;padding:14px 22px;border-radius:12px;
  font-weight:bold;text-decoration:none;cursor:pointer
}
.stats{
  display:grid;grid-template-columns:repeat(5,1fr);gap:20px;margin-bottom:30px
}
.stat{
  background:white;border:1px solid #e1e8f0;border-radius:20px;padding:25px;
  box-shadow:0 8px 25px rgba(20,50,80,.06)
}
.stat small{font-weight:bold;color:#68798b;letter-spacing:1px}
.stat h2{font-size:42px;margin-top:18px;color:#2464b7}
.stat.green h2{color:#18865b}
.stat.purple h2{color:#7654b8}
.stat.orange h2{color:#ca7a00}
.stat.red h2{color:#cf4141}
.grid{display:grid;grid-template-columns:1.4fr .8fr;gap:25px}
.panel{
  background:#fff;border:1px solid #e1e8f0;border-radius:20px;overflow:hidden
}
.panel-head{
  display:flex;justify-content:space-between;padding:22px 25px;
  border-bottom:1px solid #edf1f5
}
.panel-head h2{font-size:22px}
.panel-head a{color:#2464b7;text-decoration:none;font-weight:bold}
.project-row{
  display:flex;align-items:center;padding:15px 25px;border-bottom:1px solid #edf1f5;
  gap:15px
}
.project-row:last-child{border:0}
.thumb{
  width:82px;height:65px;border-radius:12px;background:#e5edf6;
  object-fit:cover
}
.project-info{flex:1}
.project-info h3{font-size:16px}
.project-info p{margin-top:7px;color:#68798b;font-size:14px}
.badge{
  padding:8px 12px;border-radius:20px;font-size:11px;font-weight:bold
}
.ongoing{background:#e8f2ff;color:#2464b7}
.upcoming{background:#f1eaff;color:#7654b8}
.completed{background:#e4f7ed;color:#18865b}
.inactive{background:#eef0f3;color:#607080}
.empty{text-align:center;padding:70px 20px;color:#6c7c8f}
.activity{padding:18px 25px;border-bottom:1px solid #edf1f5}
.activity b{display:block;margin-bottom:7px}
.activity small{color:#7b8998}

@media(max-width:1100px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .grid{grid-template-columns:1fr}
}
@media(max-width:700px){
  .sidebar{position:static;width:100%;height:auto}
  .app{display:block}
  .main{margin:0;width:100%;padding:20px}
  .stats{grid-template-columns:1fr}
  .top{align-items:flex-start;gap:15px;flex-direction:column}
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar">
  <div class="logo">AFFINITY <span>ADMIN</span></div>

  <nav class="nav">
    <a class="active" href="admin.html">🏠 Dashboard</a>
    <a href="add-project.html">➕ Add Project</a>
    <a href="all-projects.html">🏢 All Projects</a>
    <a href="leads.html">👥 Leads</a>
  </nav>
</aside>

<main class="main">

<div class="top">
  <div>
    <h1>Dashboard</h1>
    <p>Welcome to the Affinity Realty administration panel.</p>
  </div>
  <a class="btn" href="add-project.html">+ Add New Project</a>
</div>

<div class="stats">
  <div class="stat">
    <small>TOTAL PROJECTS</small>
    <h2 id="totalProjects">0</h2>
  </div>
  <div class="stat green">
    <small>ONGOING PROJECTS</small>
    <h2 id="ongoingProjects">0</h2>
  </div>
  <div class="stat purple">
    <small>UPCOMING PROJECTS</small>
    <h2 id="upcomingProjects">0</h2>
  </div>
  <div class="stat orange">
    <small>TOTAL LEADS</small>
    <h2 id="totalLeads">0</h2>
  </div>
  <div class="stat red">
    <small>NEW LEADS</small>
    <h2 id="newLeads">0</h2>
  </div>
</div>

<div class="grid">

<section class="panel">
  <div class="panel-head">
    <h2>Recent Projects</h2>
    <a href="all-projects.html">View All →</a>
  </div>
  <div id="recentProjects"></div>
</section>

<section class="panel">
  <div class="panel-head">
    <h2>Recent Activity</h2>
  </div>
  <div id="activityBox"></div>
</section>

</div>
</main>
</div>

<script>
function getProjects(){
  return JSON.parse(localStorage.getItem("affinityProjects") || "[]");
}
function getLeads(){
  return JSON.parse(localStorage.getItem("affinityLeads") || "[]");
}
function escapeHtml(text=""){
  const div=document.createElement("div");
  div.textContent=text;
  return div.innerHTML;
}
function statusClass(status){
  return String(status).toLowerCase();
}

function loadDashboard(){
  const projects=getProjects();
  const leads=getLeads();

  document.getElementById("totalProjects").textContent=projects.length;
  document.getElementById("ongoingProjects").textContent=
    projects.filter(p=>p.status==="Ongoing").length;
  document.getElementById("upcomingProjects").textContent=
    projects.filter(p=>p.status==="Upcoming").length;
  document.getElementById("totalLeads").textContent=leads.length;
  document.getElementById("newLeads").textContent=
    leads.filter(l=>!l.status || l.status==="New").length;

  const recent=[...projects]
    .sort((a,b)=>(b.createdAt||0)-(a.createdAt||0))
    .slice(0,5);

  const projectBox=document.getElementById("recentProjects");

  if(!recent.length){
    projectBox.innerHTML=`
      <div class="empty">
        <h3>No Projects Yet</h3>
        <p style="margin:10px 0 20px">Add your first project to get started.</p>
        <a class="btn" href="add-project.html">+ Add Project</a>
      </div>`;
  }else{
    projectBox.innerHTML=recent.map(p=>`
      <div class="project-row">
        <img class="thumb"
          src="${p.image || ''}"
          onerror="this.style.display='none'"
          alt="${escapeHtml(p.name)}">
        <div class="project-info">
          <h3>${escapeHtml(p.name)}</h3>
          <p>📍 ${escapeHtml(p.location || "No location")}</p>
        </div>
        <span class="badge ${statusClass(p.status)}">${escapeHtml(p.status)}</span>
      </div>
    `).join("");
  }

  const activity=[];
  projects.slice(-5).reverse().forEach(p=>{
    activity.push({
      text:`Project "${p.name}" added or updated`,
      date:p.updatedAt ? "Recently updated" : "Project activity"
    });
  });

  leads.slice(-5).reverse().forEach(l=>{
    activity.push({
      text:`New lead from ${l.name}`,
      date:l.project || "General enquiry"
    });
  });

  const activityBox=document.getElementById("activityBox");

  activityBox.innerHTML=activity.length
    ?activity.slice(0,6).map(a=>`
      <div class="activity">
        <b>● ${escapeHtml(a.text)}</b>
        <small>${escapeHtml(a.date)}</small>
      </div>`).join("")
    :`<div class="empty">No recent activity yet.</div>`;
}

loadDashboard();
window.addEventListener("storage",loadDashboard);
</script>

</body>
</html>
