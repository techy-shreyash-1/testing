<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Affinity Admin | Add Project</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f4f7fb;color:#1d3553}
.app{display:flex;min-height:100vh}
.sidebar{
 width:280px;background:#18324d;color:#fff;padding:30px 20px;
 position:fixed;height:100vh
}
.logo{font-size:28px;font-weight:900;margin:10px 15px 45px}
.logo span{color:#78a9f5}
.nav a{
 display:block;padding:17px 20px;margin:8px 0;border-radius:12px;
 color:#c8d5e5;text-decoration:none;font-weight:bold
}
.nav a:hover,.nav a.active{background:#2865b7;color:#fff}
.main{margin-left:280px;width:calc(100% - 280px);padding:35px}
.top{margin-bottom:30px}
.top h1{font-size:34px}
.top p{color:#6c7c8f;margin-top:8px}
.form-card{
 max-width:1100px;background:#fff;border:1px solid #e1e8f0;
 border-radius:20px;padding:30px
}
.section-title{
 font-size:19px;margin:25px 0 20px;padding-bottom:12px;
 border-bottom:1px solid #e8edf2
}
.section-title:first-child{margin-top:0}
.form-grid{
 display:grid;grid-template-columns:repeat(2,1fr);gap:20px
}
.full{grid-column:1/-1}
label{display:block;font-weight:bold;font-size:14px;margin-bottom:8px}
input,select,textarea{
 width:100%;padding:14px;border:1px solid #d8e1eb;border-radius:10px;
 font:inherit;outline:none
}
input:focus,select:focus,textarea:focus{border-color:#2464b7}
textarea{min-height:120px;resize:vertical}
.upload{
 border:2px dashed #b8c9dc;border-radius:14px;padding:25px;text-align:center;
 background:#f9fbfe
}
.upload input{margin-top:12px}
.preview{
 margin-top:15px;width:180px;height:120px;object-fit:cover;
 border-radius:12px;display:none;border:1px solid #ddd
}
.check-grid{
 display:grid;grid-template-columns:repeat(3,1fr);gap:12px
}
.check{
 display:flex;gap:8px;align-items:center;background:#f6f9fc;
 padding:12px;border-radius:10px
}
.check input{width:auto}
.toggle-box{
 background:#f7faff;padding:20px;border-radius:14px;margin-top:10px
}
.hidden{display:none}
.actions{display:flex;gap:15px;margin-top:30px}
.btn{
 border:0;padding:14px 24px;border-radius:10px;font-weight:bold;cursor:pointer;
 text-decoration:none;display:inline-block
}
.primary{background:#2464b7;color:#fff}
.secondary{background:#e7edf4;color:#29425d}
.toast{
 position:fixed;right:25px;top:25px;background:#18865b;color:#fff;
 padding:16px 22px;border-radius:12px;display:none;font-weight:bold;
 box-shadow:0 10px 30px rgba(0,0,0,.15)
}
@media(max-width:800px){
 .sidebar{position:static;width:100%;height:auto}
 .app{display:block}.main{margin:0;width:100%;padding:20px}
 .form-grid{grid-template-columns:1fr}.check-grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="toast" id="toast"></div>

<div class="app">
<aside class="sidebar">
 <div class="logo">AFFINITY <span>ADMIN</span></div>
 <nav class="nav">
  <a href="admin.html">🏠 Dashboard</a>
  <a class="active" href="add-project.html">➕ Add Project</a>
  <a href="all-project.html">🏢 All Projects</a>
  <a href="leads.html">👥 Leads</a>
 </nav>
</aside>

<main class="main">
<div class="top">
 <h1 id="pageTitle">Add New Project</h1>
 <p>Create and manage Affinity Realty projects.</p>
</div>

<form class="form-card" id="projectForm">

<input type="hidden" id="projectId">

<h2 class="section-title">Basic Information</h2>

<div class="form-grid">
 <div>
  <label>Project Name *</label>
  <input id="name" required placeholder="Enter project name">
 </div>

 <div>
  <label>Location *</label>
  <input id="location" required placeholder="Example: Dapodi, Pune">
 </div>

 <div>
  <label>Property Type *</label>
  <select id="propertyType" required>
   <option value="">Select property type</option>
   <option>Residential Project</option>
   <option>Commercial Project</option>
   <option>Plotted Development</option>
   <option>Villa Project</option>
   <option>Apartment</option>
   <option>Mixed Use Project</option>
  </select>
 </div>

 <div>
  <label>Project Status *</label>
  <select id="status" required>
   <option value="">Select status</option>
   <option>Ongoing</option>
   <option>Upcoming</option>
   <option>Completed</option>
   <option>Active</option>
   <option>Inactive</option>
  </select>
 </div>

 <div class="full">
  <label>Project Description</label>
  <textarea id="description" placeholder="Write project details..."></textarea>
 </div>
</div>

<h2 class="section-title">Property Details</h2>

<div class="form-grid">
 <div>
  <label>Price Starting From</label>
  <input id="price" placeholder="Example: ₹30,00,000">
 </div>

 <div>
  <label>Total Units / Plots</label>
  <input id="totalUnits" type="number" min="0" placeholder="Example: 100">
 </div>

 <div>
  <label>Available Units</label>
  <input id="availableUnits" type="number" min="0" placeholder="Example: 45">
 </div>

 <div>
  <label>Area</label>
  <input id="area" placeholder="Example: 1200 Sq.ft">
 </div>
</div>

<h2 class="section-title">Project Image</h2>

<div class="upload">
 <label>Upload Project Image</label>
 <input type="file" id="imageFile" accept="image/*">
 <p style="margin-top:10px;color:#718093;font-size:13px">Select an image from your computer.</p>
 <img id="imagePreview" class="preview">
</div>

<h2 class="section-title">Booking Dates (Optional)</h2>

<div class="form-grid">
 <div>
  <label>Booking Starting From</label>
  <input type="date" id="bookingStart">
 </div>
 <div>
  <label>Booking End Date</label>
  <input type="date" id="bookingEnd">
 </div>
 <div>
  <label>Possession Date</label>
  <input type="date" id="possessionDate">
 </div>
</div>

<h2 class="section-title">Offer (Optional)</h2>

<div class="toggle-box">
 <label class="check">
  <input type="checkbox" id="offerEnabled">
  Enable Special Offer
 </label>

 <div id="offerFields" class="form-grid hidden" style="margin-top:20px">
  <div>
   <label>Offer Title</label>
   <input id="offerTitle" placeholder="Example: Early Bird Offer">
  </div>
  <div>
   <label>Discount / Offer</label>
   <input id="offerDiscount" placeholder="Example: 10% Discount">
  </div>
  <div>
   <label>Offer Valid From</label>
   <input type="date" id="offerStart">
  </div>
  <div>
   <label>Offer Valid Until</label>
   <input type="date" id="offerEnd">
  </div>
 </div>
</div>

<h2 class="section-title">Amenities</h2>

<div class="check-grid" id="amenities">
 <label class="check"><input type="checkbox" value="Parking"> Parking</label>
 <label class="check"><input type="checkbox" value="24/7 Security"> 24/7 Security</label>
 <label class="check"><input type="checkbox" value="CCTV"> CCTV</label>
 <label class="check"><input type="checkbox" value="Garden"> Garden</label>
 <label class="check"><input type="checkbox" value="Gym"> Gym</label>
 <label class="check"><input type="checkbox" value="Clubhouse"> Clubhouse</label>
 <label class="check"><input type="checkbox" value="Swimming Pool"> Swimming Pool</label>
 <label class="check"><input type="checkbox" value="Lift"> Lift</label>
 <label class="check"><input type="checkbox" value="Power Backup"> Power Backup</label>
</div>

<h2 class="section-title">Project Highlights</h2>

<div class="form-grid">
 <div class="full">
  <label>Highlights (one highlight per line)</label>
  <textarea id="highlights" placeholder="Near Metro Station&#10;Excellent Connectivity&#10;Premium Location"></textarea>
 </div>
</div>

<div class="actions">
 <button class="btn primary" type="submit" id="saveBtn">Save Project</button>
 <a class="btn secondary" href="all-project.html">Cancel</a>
</div>

</form>
</main>
</div>

<script>
let selectedImage="";

function getProjects(){
 return JSON.parse(localStorage.getItem("affinityProjects") || "[]");
}
function saveProjects(projects){
 localStorage.setItem("affinityProjects",JSON.stringify(projects));
}
function showToast(message){
 const toast=document.getElementById("toast");
 toast.textContent=message;
 toast.style.display="block";
 setTimeout(()=>toast.style.display="none",3000);
}
function checkedAmenities(){
 return [...document.querySelectorAll("#amenities input:checked")]
   .map(x=>x.value);
}
function setCheckedAmenities(items=[]){
 document.querySelectorAll("#amenities input").forEach(x=>{
   x.checked=items.includes(x.value);
 });
}

document.getElementById("imageFile").addEventListener("change",function(){
 const file=this.files[0];
 if(!file)return;

 const reader=new FileReader();
 reader.onload=function(e){
   selectedImage=e.target.result;
   const preview=document.getElementById("imagePreview");
   preview.src=selectedImage;
   preview.style.display="block";
 };
 reader.readAsDataURL(file);
});

document.getElementById("offerEnabled").addEventListener("change",function(){
 document.getElementById("offerFields").classList.toggle(
   "hidden",!this.checked
 );
});

function loadEditProject(){
 const id=new URLSearchParams(location.search).get("edit");
 if(!id)return;

 const project=getProjects().find(p=>p.id===id);
 if(!project)return;

 document.getElementById("pageTitle").textContent="Edit Project";
 document.getElementById("saveBtn").textContent="Update Project";

 document.getElementById("projectId").value=project.id;
 document.getElementById("name").value=project.name||"";
 document.getElementById("location").value=project.location||"";
 document.getElementById("propertyType").value=project.propertyType||"";
 document.getElementById("status").value=project.status||"";
 document.getElementById("description").value=project.description||"";
 document.getElementById("price").value=project.price||"";
 document.getElementById("totalUnits").value=project.totalUnits||"";
 document.getElementById("availableUnits").value=project.availableUnits||"";
 document.getElementById("area").value=project.area||"";
 document.getElementById("bookingStart").value=project.bookingStart||"";
 document.getElementById("bookingEnd").value=project.bookingEnd||"";
 document.getElementById("possessionDate").value=project.possessionDate||"";
 document.getElementById("highlights").value=(project.highlights||[]).join("\n");

 selectedImage=project.image||"";
 if(selectedImage){
   imagePreview.src=selectedImage;
   imagePreview.style.display="block";
 }

 if(project.offer?.enabled){
   offerEnabled.checked=true;
   offerFields.classList.remove("hidden");
   offerTitle.value=project.offer.title||"";
   offerDiscount.value=project.offer.discount||"";
   offerStart.value=project.offer.start||"";
   offerEnd.value=project.offer.end||"";
 }

 setCheckedAmenities(project.amenities||[]);
}

document.getElementById("projectForm").addEventListener("submit",function(e){
 e.preventDefault();

 const id=document.getElementById("projectId").value;

 const project={
   id:id || "project_"+Date.now(),
   name:name.value.trim(),
   location:location.value.trim(),
   propertyType:propertyType.value,
   status:status.value,
   description:description.value.trim(),
   price:price.value.trim(),
   totalUnits:totalUnits.value,
   availableUnits:availableUnits.value,
   area:area.value.trim(),
   image:selectedImage,
   bookingStart:bookingStart.value,
   bookingEnd:bookingEnd.value,
   possessionDate:possessionDate.value,
   offer:{
     enabled:offerEnabled.checked,
     title:offerTitle.value.trim(),
     discount:offerDiscount.value.trim(),
     start:offerStart.value,
     end:offerEnd.value
   },
   amenities:checkedAmenities(),
   highlights:highlights.value.split("\n").map(x=>x.trim()).filter(Boolean),
   createdAt:Date.now(),
   updatedAt:Date.now()
 };

 const projects=getProjects();
 const index=projects.findIndex(p=>p.id===project.id);

 if(index>-1){
   project.createdAt=projects[index].createdAt;
   projects[index]=project;
   showToast("✓ Project updated successfully!");
 }else{
   projects.push(project);
   showToast("✓ Project added successfully!");
 }

 saveProjects(projects);

 setTimeout(()=>{
   location.href="all-project.html";
 },1000);
});

loadEditProject();
</script>

</body>
</html>
